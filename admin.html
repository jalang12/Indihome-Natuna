<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Natuna Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- LOGIN SECTION (Tampil sebelum masuk) -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-sm w-full shadow-2xl">
            <h2 class="text-2xl font-black text-white mb-2 text-center">🔐 Admin Login</h2>
            <p class="text-slate-400 text-xs text-center mb-6">Masukkan sandi rahasia untuk masuk ke panel.</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="adminPassword" required placeholder="Masukkan Sandi (Contoh: admin123)" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white text-sm">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-600/30">
                    Masuk Panel
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN ADMIN PANEL (Tampil setelah login) -->
    <div>
        <!-- NAVBAR ADMIN -->
        <nav class="bg-slate-900 border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <span class="text-xl font-extrabold tracking-wider text-indigo-500">NATUNA<span class="text-white">ADMIN</span></span>
                    <button onclick="logoutAdmin()" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition">
                        Keluar
                    </button>
                </div>
            </div>
        </nav>

        <!-- KONTEN UTAMA -->
        <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div class="mb-8">
                <h1 class="text-3xl font-black text-white">Panel Proses Transaksi</h1>
                <p class="text-slate-400 text-sm mt-1">Kirim konfirmasi sukses diamond / item game ke pelanggan via WhatsApp.</p>
            </div>

            <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-xl space-y-6">
                <h2 class="text-lg font-bold text-indigo-400">⚡ Buat Struk Bukti Sukses Top-Up</h2>
                
                <form onsubmit="sendSuccessWhatsApp(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor WhatsApp Pembeli</label>
                            <input type="tel" id="buyerPhone" required placeholder="Contoh: 628123456789" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Pilih Game</label>
                            <select id="successGame" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white text-sm">
                                <option value="Mobile Legends">Mobile Legends</option>
                                <option value="Free Fire">Free Fire</option>
                                <option value="PUBG Mobile">PUBG Mobile</option>
                                <option value="Genshin Impact">Genshin Impact</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">User ID Tujuan</label>
                            <input type="text" id="successUserId" required placeholder="ID Pembeli" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nominal Item yang Dikirim</label>
                            <input type="text" id="successItem" required placeholder="Contoh: 86 Diamonds" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white text-sm">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-600/30 transition text-sm flex items-center justify-center gap-2">
                        <span>Kirim Struk Sukses ke WhatsApp Pembeli 🚀</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-slate-500 text-xs">
        &copy; 2026 Natuna Store - Admin Control Panel.
    </footer>

    <!-- SCRIPT ADMIN -->
    <script>
        // Password Admin (Bisa lo ubah di sini, misal jadi sandi lain)
        const SECRET_PIN = "natuna123";

        function handleLogin(event) {
            event.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            if(pass === SECRET_PIN) {
                document.getElementById('loginScreen').style.display = 'none';
            } else {
                alert('Sandi salah! Coba lagi.');
            }
        }

        function logoutAdmin() {
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginScreen').style.display = 'flex';
        }

        function sendSuccessWhatsApp(event) {
            event.preventDefault();
            
            let phone = document.getElementById('buyerPhone').value;
            const game = document.getElementById('successGame').value;
            const userId = document.getElementById('successUserId').value;
            const item = document.getElementById('successItem').value;
            
            // Format nomor HP agar diawali kode negara 62 jika diawali angka 0
            if(phone.startsWith('0')) {
                phone = '62' + phone.slice(1);
            }

            const invoiceId = "NAT-" + Math.floor(100000 + Math.random() * 900000);
            
            const message = `*✨ STRUK BUKTI TRANSAKSI SUKSES ✨*%0A*NATUNA STORE*%0A%0PHalo Kak, pesanan top up game Anda telah berhasil diproses dan dikirim ke akun tujuan!%0A%0A- No. Invoice: *${invoiceId}*%0A- Game: *${game}*%0A- User ID: *${userId}*%0A- Item / Nominal: *${item}*%0A- Status: *SUKSES (MASUK)*%0A%0ATerima kasih sudah berbelanja di Natuna Store. Ditunggu orderan selanjutnya ya! 🙏✨`;
            
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
